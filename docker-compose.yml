name: task-control-go

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TASK_CONTROL_DATABASE_URL: ${TASK_CONTROL_DATABASE_URL:?set TASK_CONTROL_DATABASE_URL in .env (use host.docker.internal for a host database)}
      TASK_CONTROL_SECRET_KEYS: ${TASK_CONTROL_SECRET_KEYS:?set TASK_CONTROL_SECRET_KEYS in .env}
      TASK_CONTROL_SECRET_ACTIVE_VERSION: ${TASK_CONTROL_SECRET_ACTIVE_VERSION:-1}
      TASK_CONTROL_COOKIE_SECURE: ${TASK_CONTROL_COOKIE_SECURE:-false}
      TASK_CONTROL_SCRIPT_ROOT: /opt/task-scripts
      TASK_CONTROL_OUTPUT_ROOT: /var/lib/task-control-output
      TASK_CONTROL_WORKER_CONCURRENCY: ${TASK_CONTROL_WORKER_CONCURRENCY:-4}
      TASK_CONTROL_LOG_LEVEL: ${TASK_CONTROL_LOG_LEVEL:-INFO}
      TASK_CONTROL_HTTP_ADDR: 0.0.0.0:8000
    ports:
      - "${TASK_CONTROL_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./task-scripts:/opt/task-scripts:ro
      - task_control_output:/var/lib/task-control-output
    healthcheck:
      test: ["CMD", "task-control", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  task_control_output:
